# Temporary client-review deployment to GitHub Pages.
# Builds under the repository subpath (https://<user>.github.io/<repo>/) with noindex enabled.
# Production on https://arcinds.com uses a normal `npm run build` and is not affected.
name: Deploy review site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Run one deployment at a time and let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build for the repository subpath
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_REVIEW_BUILD: 'true'

      # GitHub Pages has no SPA rewrites: serve the app for unknown paths so direct
      # visits and refreshes on routes such as /about still load the site.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
